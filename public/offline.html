<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Offline — ServerScope</title>
    <style>
        :root { color-scheme: light dark; --bg: #fafafa; --text: #18181b; --muted: #52525b; --accent: #2f5fd0; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --text: #ededef; --muted: #a1a1aa; --accent: #7aa2f7; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
        main { max-width: 22rem; padding: 2rem; }
        svg { width: 3rem; height: 3rem; color: var(--accent); }
        h1 { margin: 1rem 0 .5rem; font-size: 1.375rem; }
        p { margin: 0 0 1.5rem; color: var(--muted); }
        button { padding: .65rem 1.25rem; border: 0; border-radius: 10px; background: var(--accent); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l3-8 5 16 3-8h5"/></svg>
    <h1 lang="en">You are offline</h1>
    <p lang="en">ServerScope needs a connection to show live data. <span lang="nl">Je bent offline; ServerScope heeft een verbinding nodig voor live gegevens.</span></p>
    <button type="button" onclick="location.reload()">Try again · Opnieuw proberen</button>
</main>
</body>
</html>
